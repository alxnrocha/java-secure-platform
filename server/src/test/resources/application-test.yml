spring:
  application:
    name: vaultledger-server-test
  datasource:
    url: jdbc:h2:mem:vaultledger_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379

vaultledger:
  security:
    jwt:
      access-token-expiration-minutes: 15
      refresh-token-expiration-days: 7
      issuer: vaultledger-auth-service
